openapi: 3.1.0
info:
  title: AI Sales Platform API
  version: 2.0.0
  description: Authenticated, tenant-isolated CRM, reporting, settings, and AI workflows.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - { name: Health, description: Runtime probes }
  - { name: Authentication, description: Account lifecycle and sessions }
  - { name: CRM, description: Tenant-owned sales leads }
  - { name: Reports, description: Database-aggregated sales reporting }
  - { name: Settings, description: User profile and preferences }
  - { name: AI, description: Research and email generation }
  - { name: Research, description: Evidence-grounded provider research }
  - { name: Campaigns, description: Approval-gated outreach campaigns }
  - { name: Operations, description: "Tasks, replies, and observed analytics" }
  - { name: Sales Department, description: Bounded tenant automation and workforce status }
  - { name: Webhooks, description: Signed provider delivery events }
  - { name: Admin, description: Role-protected system operations }
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      security: []
      summary: Process liveness probe
      responses:
        "200": { description: Process is alive }
        "403": { $ref: "#/components/responses/Forbidden" }
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      security: []
      summary: PostgreSQL and Redis readiness probe
      responses:
        "200": { description: Dependencies are ready }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/register:
    post:
      operationId: registerAccount
      tags: [Authentication]
      security: []
      summary: Create an account and send a verification link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { description: Account created; verification required }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/verification/request:
    post:
      operationId: requestEmailVerification
      tags: [Authentication]
      security: []
      summary: Request a replacement verification link
      requestBody: { $ref: "#/components/requestBodies/EmailRequest" }
      responses:
        "202": { description: Generic accepted response prevents account enumeration }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [Authentication]
      security: []
      summary: Verify email and return one-time recovery codes
      requestBody: { $ref: "#/components/requestBodies/TokenRequest" }
      responses:
        "200": { description: Email verified and session established }
        "400": { $ref: "#/components/responses/BadRequest" }
  /auth/login:
    post:
      operationId: login
      tags: [Authentication]
      security: []
      summary: Sign in with a verified email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { description: Access token returned and refresh cookie set }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [Authentication]
      security: [{ refreshCookie: [] }]
      summary: Atomically rotate a refresh session
      responses:
        "200": { description: New access token and refresh cookie returned }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      security: [{ refreshCookie: [] }]
      summary: Revoke the current refresh session
      responses:
        "204": { description: Session revoked or already absent }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [Authentication]
      security: []
      summary: Request a one-time password reset link
      requestBody: { $ref: "#/components/requestBodies/EmailRequest" }
      responses:
        "202": { description: Generic accepted response prevents account enumeration }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [Authentication]
      security: []
      summary: Change password and revoke all sessions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Password changed and sessions revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
  /auth/recover:
    post:
      operationId: recoverAccount
      tags: [Authentication]
      security: []
      summary: Recover an account with a one-time backup code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryRequest" }
      responses:
        "204": { description: "Password changed, code consumed, and sessions revoked" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/recovery-codes:
    post:
      operationId: replaceRecoveryCodes
      tags: [Authentication]
      summary: Replace recovery codes after password confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties: { password: { type: string, format: password, maxLength: 128 } }
      responses:
        "200": { description: New one-time recovery codes returned }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [Authentication]
      summary: Return the current user and settings
      responses:
        "200": { description: Current account }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /leads:
    get:
      operationId: listLeads
      tags: [CRM]
      summary: List a cursor-paginated tenant lead page
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/LeadStatus" } }
      responses:
        "200": { description: Lead page }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createLead
      tags: [CRM]
      summary: Create a tenant-owned lead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadInput" }
      responses:
        "201": { description: Lead created }
        "400": { $ref: "#/components/responses/BadRequest" }
  /leads/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      operationId: updateLead
      tags: [CRM]
      summary: Update a tenant-owned lead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadInput" }
      responses:
        "200": { description: Lead updated }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteLead
      tags: [CRM]
      summary: Delete a tenant-owned lead
      responses:
        "204": { description: Lead deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /reports/summary:
    get:
      operationId: getReportSummary
      tags: [Reports]
      summary: Return database-aggregated tenant reporting
      responses:
        "200": { description: "Summary, monthly counts, and status distribution" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /settings:
    get:
      operationId: getSettings
      tags: [Settings]
      summary: Read user settings
      responses:
        "200": { description: Settings returned }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: updateSettings
      tags: [Settings]
      summary: Update profile and preferences
      responses:
        "200": { description: Settings updated }
        "409": { $ref: "#/components/responses/Conflict" }
  /settings/account:
    delete:
      operationId: deleteOwnAccount
      tags: [Settings]
      summary: Permanently delete the authenticated account after exact confirmation
      responses:
        "204": { description: Account and user-owned records deleted }
        "409": { $ref: "#/components/responses/Conflict" }
  /research/status:
    get:
      operationId: getResearchProviderStatus
      tags: [Research]
      summary: Return sanitized search configuration state
      responses:
        "200": { description: Configuration state returned without secrets }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /research/jobs:
    get:
      operationId: listResearchJobs
      tags: [Research]
      summary: List owned structured research jobs
      responses:
        "200": { description: Research job page }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createResearchJob
      tags: [Research]
      summary: Run a confirmed provider search and evidence-grounded analysis
      responses:
        "201": { description: Structured research job completed }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [Campaigns]
      summary: List owned campaigns
      responses:
        "200": { description: Campaigns returned }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createCampaign
      tags: [Campaigns]
      summary: Create an unsent draft campaign
      responses:
        "201": { description: Draft campaign created }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /campaigns/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: approveCampaign
      tags: [Campaigns]
      summary: Store an immutable approval snapshot for the current version
      responses:
        "201": { description: Campaign version approved }
        "422": { $ref: "#/components/responses/BadRequest" }
  /campaigns/{id}/queue:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: queueApprovedCampaign
      tags: [Campaigns]
      summary: Queue only current, explicitly approved messages
      responses:
        "200": { description: Approved unsuppressed messages queued }
        "409": { $ref: "#/components/responses/Conflict" }
  /campaigns/{id}/send-approved:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: sendApprovedCampaignBatch
      tags: [Campaigns]
      summary: Process one explicit bounded batch after all safety checks
      responses:
        "200": { description: Bounded batch result }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /operations/inbox:
    get:
      operationId: getHumanReplyInbox
      tags: [Operations]
      summary: List owned replies requiring human judgment
      responses:
        "200": { description: Reply inbox returned }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /operations/tasks:
    get:
      operationId: listTasks
      tags: [Operations]
      summary: List owned operational tasks
      responses:
        "200": { description: Tasks returned }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /operations/analytics:
    get:
      operationId: getCampaignAnalytics
      tags: [Operations]
      summary: Return metrics computed from stored events only
      responses:
        "200": { description: Observed analytics returned }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [Admin]
      summary: Return aggregate health and sanitized audit metadata
      responses:
        "200": { description: Admin overview returned }
        "403": { $ref: "#/components/responses/Forbidden" }
  /ai/demo:
    post:
      operationId: runAiDemo
      tags: [AI]
      security: []
      summary: Run the public, rate-limited mock demonstration
      responses:
        "200": { description: Mock result }
        "429": { $ref: "#/components/responses/RateLimited" }
  /ai/research:
    post:
      operationId: createAiResearch
      tags: [AI]
      summary: Generate and retain an authenticated research result
      responses:
        "200": { description: AI research result }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /ai/email:
    post:
      operationId: createAiEmail
      tags: [AI]
      summary: Generate and retain an authenticated sales email
      responses:
        "200": { description: AI email result }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
  /webhooks/email/{provider}:
    post:
      operationId: receiveEmailWebhook
      tags: [Webhooks]
      security: []
      summary: Receive an idempotent, timestamped, HMAC-signed email event
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [resend, sendgrid, postmark, smtp] }
        - name: X-Webhook-Timestamp
          in: header
          required: true
          description: Unix seconds within five minutes of receipt.
          schema: { type: string, pattern: "^[0-9]{10}$" }
        - name: X-Webhook-Signature
          in: header
          required: true
          description: HMAC-SHA256 of `<timestamp>.<exact raw JSON body>` using EMAIL_WEBHOOK_SECRET.
          schema: { type: string, pattern: "^sha256=[A-Fa-f0-9]{64}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailWebhookEvent" }
      responses:
        "200": { description: Duplicate event accepted idempotently }
        "202": { description: New or unknown-message event accepted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /unsubscribe:
    get:
      operationId: showUnsubscribeConfirmation
      tags: [Campaigns]
      security: []
      summary: Show confirmation for a signed tenant-scoped unsubscribe capability
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string, minLength: 20, maxLength: 1000 }
      responses:
        "200": { description: Confirmation page }
        "400": { description: Invalid signed capability }
    post:
      operationId: oneClickUnsubscribe
      tags: [Campaigns]
      security: []
      summary: Suppress a recipient and cancel pending messages using a signed one-click capability
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string, minLength: 20, maxLength: 1000 }
      responses:
        "204": { description: Idempotent non-enumerating unsubscribe response }
        "429": { description: Rate limit reached }
  /sales-department/status:
    get:
      operationId: getSalesDepartmentStatus
      tags: [Sales Department]
      summary: Return tenant-labeled workforce state, observed metrics, blockers, providers, and jobs
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: Current tenant sales department status }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /sales-department/config:
    put:
      operationId: configureSalesDepartment
      tags: [Sales Department]
      summary: Save bounded autonomy, approval, sender, quiet-hour, budget, and volume controls
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { description: Department controls saved and audited }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /sales-department/start:
    post:
      operationId: startSalesDepartment
      tags: [Sales Department]
      summary: Queue the initial idempotent bounded jobs after preflight checks
      responses:
        "202": { description: Jobs accepted }
        "409": { $ref: "#/components/responses/Conflict" }
  /sales-department/pause:
    post:
      operationId: pauseSalesDepartment
      tags: [Sales Department]
      summary: Pause the department and cancel pending tenant jobs
      responses:
        "200": { description: Department paused }
        "403": { $ref: "#/components/responses/Forbidden" }
  /sales-department/emergency-stop:
    post:
      operationId: emergencyStopSalesDepartment
      tags: [Sales Department]
      summary: Stop jobs, pending messages, and non-terminal campaigns for the tenant
      responses:
        "200": { description: Emergency stop completed and audited }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/jobs:
    get:
      operationId: listAutomationJobs
      tags: [Admin]
      summary: List sanitized bounded-job state across workspaces
      responses:
        "200": { description: Job state returned without raw payloads }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/system:
    get:
      operationId: getAdminSystemStatus
      tags: [Admin]
      summary: Return sanitized dependency, provider, worker, queue, and revision status
      responses:
        "200": { description: Sanitized system status }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    refreshCookie: { type: apiKey, in: cookie, name: refresh_token }
  schemas:
    Password: { type: string, format: password, minLength: 12, maxLength: 128 }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { $ref: "#/components/schemas/Password" }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, maxLength: 128 }
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties: { token: { type: string, minLength: 32, maxLength: 256 } }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, minLength: 32, maxLength: 256 }
        password: { $ref: "#/components/schemas/Password" }
    RecoveryRequest:
      type: object
      additionalProperties: false
      required: [email, recoveryCode, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        recoveryCode: { type: string, minLength: 20, maxLength: 32 }
        password: { $ref: "#/components/schemas/Password" }
    LeadStatus:
      type: string
      enum: [INTERESTED, MEETING, FOLLOW_UP, PROPOSAL_SENT, CLOSED, LOST]
    LeadInput:
      type: object
      properties:
        company: { type: string, maxLength: 160 }
        contact: { type: string, maxLength: 160 }
        email: { type: [string, "null"], format: email, maxLength: 254 }
        phone: { type: [string, "null"], maxLength: 50 }
        industry: { type: [string, "null"], maxLength: 120 }
        status: { $ref: "#/components/schemas/LeadStatus" }
        value: { type: number, minimum: 0, maximum: 9999999999999.99 }
        notes: { type: [string, "null"], maxLength: 10000 }
    EmailWebhookEvent:
      type: object
      additionalProperties: false
      required: [providerEventId, messageId, type, occurredAt]
      properties:
        providerEventId: { type: string, minLength: 1, maxLength: 200 }
        messageId: { type: string, minLength: 1, maxLength: 64 }
        type: { type: string, enum: [DELIVERED, BOUNCED, COMPLAINT, UNSUBSCRIBED, REPLIED] }
        occurredAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
  requestBodies:
    EmailRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [email]
            properties: { email: { type: string, format: email, maxLength: 254 } }
    TokenRequest:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TokenRequest" }
  responses:
    BadRequest: { description: Validation or token failure, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthorized: { description: Authentication failed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: Operation is not permitted, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: Resource missing or belongs to another tenant, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Conflict: { description: Resource state conflict, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    RateLimited: { description: Request rate limit exceeded, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    BadGateway: { description: AI provider response failure, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    ServiceUnavailable: { description: Required dependency unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
